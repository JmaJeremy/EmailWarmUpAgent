server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 10m;  # logo uploads

    # API (and uploaded logos at /api/uploads/…) → FastAPI backend, with the /api prefix stripped
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app — every other path serves index.html
    location / {
        try_files $uri /index.html;
    }
}
